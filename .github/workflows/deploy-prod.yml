name: Deploy Prod

on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.meta.outputs.backend }}
      web_image: ${{ steps.meta.outputs.web }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        run: |
          SHA_SHORT="${GITHUB_SHA::12}"
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BACKEND="${REGISTRY}/${OWNER_LC}/portfolio-backend:prod"
          WEB="${REGISTRY}/${OWNER_LC}/portfolio-web:prod"
          echo "backend=${BACKEND}" >> "$GITHUB_OUTPUT"
          echo "web=${WEB}" >> "$GITHUB_OUTPUT"
          echo "backend_sha=${BACKEND}-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "web_sha=${WEB}-${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.backend }}
            ${{ steps.meta.outputs.backend_sha }}
          cache-from: type=gha,scope=backend-prod
          cache-to: type=gha,mode=max,scope=backend-prod

      - name: Build web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.web }}
            ${{ steps.meta.outputs.web_sha }}
          build-args: |
            VITE_API_URL=/api/chat
          cache-from: type=gha,scope=web-prod
          cache-to: type=gha,mode=max,scope=web-prod

  deploy:
    name: Deploy on VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_PATH }}"
            git fetch origin prod
            git checkout prod
            git pull --ff-only origin prod
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin
            chmod +x deploy/scripts/deploy.sh
            ./deploy/scripts/deploy.sh prod \
              "${{ needs.build-and-push.outputs.backend_image }}" \
              "${{ needs.build-and-push.outputs.web_image }}"
