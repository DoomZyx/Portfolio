name: CI

on:
  pull_request:
    branches: [dev, preprod, prod]
  push:
    branches: [dev, preprod, prod]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Unit tests (si présents)
        run: |
          if pnpm run | grep -q "test:recommendation"; then
            pnpm run test:recommendation
          else
            echo "Pas de script test:recommendation — skip"
          fi
      - run: pnpm run build

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Unit tests (si présents)
        run: |
          if pnpm run | grep -q "test:recommendation"; then
            pnpm run test:recommendation
          else
            echo "Pas de script test:recommendation — skip"
          fi
      - run: pnpm run lint
      - run: pnpm run build
        env:
          VITE_API_URL: /api/chat
