# Nginx hôte OVH — prod
# Upstream Docker : 127.0.0.1:50122
# Installer dans /etc/nginx/sites-available/ puis symlink sites-enabled
# Certbot: certbot --nginx -d axelcella.com -d www.axelcella.com

upstream portfolio_prod {
    server 127.0.0.1:50122;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name axelcella.com www.axelcella.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://axelcella.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name axelcella.com www.axelcella.com;

    ssl_certificate     /etc/letsencrypt/live/axelcella.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/axelcella.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    if ($host = www.axelcella.com) {
        return 301 https://axelcella.com$request_uri;
    }

    location / {
        proxy_pass http://portfolio_prod;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }
}
